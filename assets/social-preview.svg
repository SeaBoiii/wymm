    <g transform="translate(181 194) scale(.78)"><ellipse rx="17" ry="38"/><ellipse rx="17" ry="38" transform="rotate(72)"/><ellipse rx="17" ry="38" transform="rotate(144)"/><circle r="9" fill="#c6a96c" stroke="none"/></g>
