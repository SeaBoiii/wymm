<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">A little garden, made with love</title>
  <desc id="desc">A spoiler-safe moonlit botanical card in forest green, cream, and antique gold.</desc>
  <defs>
    <radialGradient id="sky" cx="68%" cy="20%" r="90%">
      <stop stop-color="#285047"/>
      <stop offset=".58" stop-color="#102e26"/>
      <stop offset="1" stop-color="#061713"/>
    </radialGradient>
    <radialGradient id="moon">
      <stop stop-color="#fff8df"/>
      <stop offset="1" stop-color="#d8c58f"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="933" cy="135" r="56" fill="#e5d6aa" opacity=".22" filter="url(#glow)"/>
  <circle cx="933" cy="135" r="38" fill="url(#moon)"/>
